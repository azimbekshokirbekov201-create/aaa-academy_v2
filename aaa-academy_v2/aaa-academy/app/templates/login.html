<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1267ee">
  <title>AAA Academy — Kirish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static',path='css/style.css') }}?v=5">
</head>
<body class="login">
  <div class="login-card">
    <div class="logo">AAA</div>
    <span class="eyebrow">AAA ACADEMY</span>
    <h1>Xush kelibsiz 👋</h1>
    <p>Akkauntingizga kiring va o‘qish jarayonini davom ettiring.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Login<input name="username" required autocomplete="username" placeholder="Username"></label>
      <label>Parol<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
      <button class="primary full" type="submit">Kirish →</button>
    </form>
  </div>
</body>
</html>
